{# 학습 관리 대시보드 #}
<div class="px-4 mt-4" id="dashboardRoot">
    <div class="d-flex justify-content-between align-items-sm-center flex-column flex-sm-row mb-4">
        <div class="me-4 mb-3 mb-sm-0">
            <h1 class="mb-0">{{ title }}</h1>
            <div class="small">
                <span class="fw-500 text-primary">{{ now.weekday }}</span>
                · {{ now.date }}
                · {{ now.time }}
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-sm btn-outline-primary" href="/admin/user">회원 관리</a>
            <a class="btn btn-sm btn-outline-primary" href="/admin/study/create">학습 등록</a>
            <a class="btn btn-sm btn-primary" href="/admin/reviews">풀이 이력</a>
        </div>
    </div>

    <div class="row" id="dashCards">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start-lg border-start-primary h-100">
                <div class="card-body">
                    <div class="small fw-bold text-primary mb-1">회원 수</div>
                    <div class="h3 mb-0" data-card="user_count">—</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start-lg border-start-secondary h-100">
                <div class="card-body">
                    <div class="small fw-bold text-secondary mb-1">학습 문항 수</div>
                    <div class="h3 mb-0" data-card="study_count">—</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start-lg border-start-success h-100">
                <div class="card-body">
                    <div class="small fw-bold text-success mb-1">오늘 풀이 수</div>
                    <div class="h3 mb-0" data-card="today_reviews">—</div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-start-lg border-start-info h-100">
                <div class="card-body">
                    <div class="small fw-bold text-info mb-1">정답률</div>
                    <div class="h3 mb-0"><span data-card="correct_rate">—</span><span class="fs-6 text-muted">%</span></div>
                    <div class="text-xs text-muted mt-1" data-card="correct_hint"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="card mb-4 h-100">
                <div class="card-header">최근 7일 풀이 추이</div>
                <div class="card-body">
                    <div class="chart-area" style="height: 260px;">
                        <canvas id="dashTrendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4 mb-4">
            <div class="card mb-4 h-100">
                <div class="card-header">채점 비율</div>
                <div class="card-body">
                    <div class="chart-pie mb-3" style="height: 200px;">
                        <canvas id="dashSolutionChart"></canvas>
                    </div>
                    <div class="list-group list-group-flush" id="dashSolutionLegend"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-7 mb-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>최근 풀이</span>
                    <a class="small" href="/admin/reviews">전체 보기</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover mb-0">
                            <thead>
                            <tr>
                                <th>시간</th>
                                <th>회원</th>
                                <th>문제</th>
                                <th>결과</th>
                            </tr>
                            </thead>
                            <tbody id="dashRecentBody">
                            <tr><td colspan="4" class="text-muted px-3">불러오는 중…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-5 mb-4">
            <div class="card mb-4">
                <div class="card-header">부위·영상별 문항 수</div>
                <div class="list-group list-group-flush small" id="dashPartModalList">
                    <div class="list-group-item text-muted">불러오는 중…</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">시스템 상태</div>
                <div class="list-group list-group-flush small" id="dashHealthList">
                    <div class="list-group-item text-muted">불러오는 중…</div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    window.__DASHBOARD_BOOTSTRAP__ = {{ dashboard_stats | tojson }};
</script>
