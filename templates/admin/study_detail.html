{# 학습 상세/수정 #}
<style>
    [data-slide-stage] {
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    [data-slide-stage] img {
        transition: opacity 180ms ease;
    }
</style>
<div class="px-4" id="studyDetailRoot" data-study-idx="{{ study_idx }}"
     data-public-base="{{ nas_public_base_url }}">
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span>학습 상세 #{{ study_idx }}</span>
            <a class="btn btn-sm btn-light text-secondary open-in-tab" href="/admin/study?partial=1"
               data-tab-title="학습 관리">
                <i class="me-1" data-feather="arrow-left"></i>
                목록으로
            </a>
        </div>
        <div class="card-body">
            <div id="studyDetailLoading" class="text-muted mb-3">불러오는 중…</div>
            <form name="studyDetail" id="studyDetailForm" class="d-none" autocomplete="off"
                  enctype="multipart/form-data">
                <input type="hidden" name="idx" id="detailStudyIdx" value="{{ study_idx }}"/>
                <div class="row gx-3">
                    <div class="col-lg-5 mb-3">
                        <label class="small mb-1">이미지 미리보기</label>
                        <div class="border rounded p-2 bg-light text-center" data-slide-stage tabindex="0">
                            <img id="studyDetailImage" src="" alt="학습 이미지"
                                 class="img-fluid" style="max-height: 420px; object-fit: contain;"/>
                            <div id="studyDetailImageEmpty" class="text-muted py-5 d-none">이미지가 없습니다.</div>
                        </div>
                        <div class="d-none align-items-center justify-content-center gap-2 mt-2" data-slide-nav>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-slide-prev>이전</button>
                            <span class="small text-muted" data-slide-count>1 / 1</span>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-slide-next>다음</button>
                        </div>
                        <div class="form-text mt-2" id="studyDetailImagePath"></div>
                    </div>
                    <div class="col-lg-7">
                        <div class="row gx-3">
                            <div class="col-md-6 mb-3">
                                <label class="small mb-1" for="detailStPart">학습 부위 (st_part)</label>
                                <select class="form-select" id="detailStPart" name="st_part" required>
                                    <option value="">선택</option>
                                    {% for code, label in part_labels.items() %}
                                    <option value="{{ code }}">{{ code }}: {{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small mb-1" for="detailStModal">영상 종류 (st_modal)</label>
                                <select class="form-select" id="detailStModal" name="st_modal" required>
                                    <option value="">선택</option>
                                    {% for code, label in modal_labels.items() %}
                                    <option value="{{ code }}">{{ code }}: {{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small mb-1" for="detailStDisease">병명 (st_disease)</label>
                                <input class="form-control" id="detailStDisease" name="st_disease" type="text"
                                       maxlength="30" required/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small mb-1">등록일</label>
                                <input class="form-control" id="detailCreatedAt" type="text" readonly/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small mb-1">수정일</label>
                                <input class="form-control" id="detailUpdatedAt" type="text" readonly/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center justify-content-between mt-3">
                    <button type="button" class="btn btn-outline-danger" id="studyDetailDeleteBtn">
                        <i class="me-1" data-feather="trash-2"></i>
                        삭제
                    </button>
                    <div>
                        <a class="btn btn-light me-2 open-in-tab" href="/admin/study?partial=1"
                           data-tab-title="학습 관리">목록</a>
                        <button type="submit" class="btn btn-primary" id="studyDetailSaveBtn">
                            <i class="me-1" data-feather="save"></i>
                            저장
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    window.STUDY_PART_LABELS = {{ part_labels | tojson }};
    window.STUDY_MODAL_LABELS = {{ modal_labels | tojson }};
</script>
<script src="/assets/js/admin/study-detail.js"></script>
<script>
    if (window.initStudyDetail) window.initStudyDetail();
    if (window.feather) feather.replace();
</script>
