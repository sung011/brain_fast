<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Login - SB Admin Pro</title>
    <link href="/assets/css/styles.css" rel="stylesheet"/>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.png"/>
    <script>
        // api.js / utils.js 가 참조하는 서버 주소. 현재 호스트(예: http://127.0.0.1:8000)
        const baseUrl = window.location.origin;
    </script>
    <script src="/assets/js/common/api.js"></script>
    <script src="/assets/js/common/utils.js"></script>
    <script src="/assets/js/common/sweetalert2.all.min.js"></script>
    <script data-search-pseudo-elements="" defer=""
            src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
</head>
<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container-xl px-4">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <!-- Basic login form-->
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header  text-center"><h3 class="my-4">관리자</h3></div>
                            <div class="card-body">
                                <!-- Login form-->
                                <form name="login" autocomplete="off">
                                    <!-- Form Group (email address)-->
                                    <div class="mb-3">
                                        <label class="small mb-1" for="inputEmailAddress">아이디: </label>
                                        <input class="form-control" id="inputEmailAddress" name="userId" type="text"
                                               placeholder="아이디를 입력하세요."/>
                                    </div>
                                    <!-- Form Group (password)-->
                                    <div class="mb-3">
                                        <label class="small mb-1" for="inputPassword">비밀번호: </label>
                                        <input class="form-control" id="inputPassword" name="userPw" type="password"
                                               placeholder="비밀번호를 입력하세요."/>
                                    </div>

                                    <!-- Form Group (login box)-->
                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <a class="small"></a>
                                        <button type="submit" class="btn btn-primary">Login</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/scripts.js"></script>
<script src="/assets/js/admin/login.js"></script>
</body>
</html>
