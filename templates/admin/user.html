<div class=" px-4">
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span>회원 목록</span>
            {# 회원가입 탭 열기. partial=1 이면 레이아웃 없이 폼 HTML만 가져온다 #}
            <a class="btn btn-sm btn-light text-primary add-user-button open-in-tab" href="/admin/user/signup?partial=1" data-tab-title="회원가입">
                <i class="me-1" data-feather="user-plus"></i>
                <span class="button-text">회원가입</span>
            </a>
        </div>
        <div class="card-body">
            <table class="table table-hover datatable-target" style="width:100%">
                <thead>
                <tr>
                    <th>이메일(아이디)</th>
                    <th>이름(닉네임)</th>
                    <th>생년월일</th>
                    <th>학교</th>
                    <th>전공</th>
                    <th>권한</th>
                    <th>가입일</th>
                    <th></th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userEditModal" tabindex="-1" aria-labelledby="userEditModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userEditModalLabel">회원 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
            </div>
            <div class="modal-body">
                <form name="userEdit" id="userEditForm" autocomplete="off">
                    <input type="hidden" name="idx" id="editUserIdx">
                    <div class="row gx-3">
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserId">이메일(아이디)</label>
                            <input class="form-control" id="editUserId" name="userId" type="email" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserName">이름(닉네임)</label>
                            <input class="form-control" id="editUserName" name="userName" type="text"
                                   maxlength="10">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserBirth">생년월일</label>
                            <input class="form-control" id="editUserBirth" name="userBirth" type="date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserUn">학교</label>
                            <input class="form-control" id="editUserUn" name="userUn" type="text" maxlength="20">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserSp">전공</label>
                            <input class="form-control" id="editUserSp" name="userSp" type="text" maxlength="20">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserMbLevel">권한</label>
                            <select class="form-select" id="editUserMbLevel" name="mbLevel">
                                <option value="1">일반 회원</option>
                                <option value="10">관리자</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserPw">비밀번호</label>
                            <input class="form-control" id="editUserPw" name="userPw" type="password"
                                   placeholder="변경 시에만 입력" minlength="4">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small mb-1" for="editUserPwConfirm">비밀번호 확인</label>
                            <input class="form-control" id="editUserPwConfirm" name="userPwConfirm" type="password"
                                   placeholder="변경 시에만 입력" minlength="4">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="userEditSaveBtn">저장</button>
            </div>
        </div>
    </div>
</div>
<script src="/assets/js/admin/user-manager.js"></script>
