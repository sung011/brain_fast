<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아이디·비밀번호 찾기 | 메디스캔 노트</title>
  <link rel="stylesheet" href="/assets/css/find-account.css">
  <script src="/assets/js/find-account.js" defer></script>
</head>
<body>
  <main class="account-page">
    <a class="brand" href="/" aria-label="메디스캔 노트 홈">메디스캔 <span>노트</span></a>
    <section class="account-card" aria-labelledby="pageTitle">
      <div class="card-heading">
        <p class="eyebrow">계정 찾기</p>
        <h1 id="pageTitle">다시 학습을 이어가세요</h1>
        <p>가입하실 때 입력한 정보로 계정을 찾을 수 있습니다.</p>
      </div>
      <div class="tabs" role="tablist" aria-label="계정찾기 방법">
        <button id="idTab" type="button" role="tab" aria-selected="true" aria-controls="idPanel">아이디 찾기</button>
        <button id="pwTab" type="button" role="tab" aria-selected="false" aria-controls="pwPanel" tabindex="-1">비밀번호 재설정</button>
      </div>

      <section id="idPanel" role="tabpanel" aria-labelledby="idTab">
        <form id="findIdForm">
          <div class="field"><label for="findIdName">이름</label><input id="findIdName" name="user_name" autocomplete="name" maxlength="10" required placeholder="가입 시 입력한 이름"></div>
          <div class="field"><label for="findIdBirth">생년월일</label><input id="findIdBirth" name="user_birth" inputmode="numeric" autocomplete="bday" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" required placeholder="YYYY-MM-DD" aria-describedby="idBirthHelp"><small id="idBirthHelp">숫자 8자리를 입력하면 자동으로 구분됩니다.</small></div>
          <button class="primary" type="submit">아이디 찾기</button>
        </form>
        <p id="idStatus" class="status" role="status" aria-live="polite" hidden></p>
        <div id="idResult" class="result" hidden><p>가입된 아이디</p><ul id="foundIds"></ul><button id="useFoundId" class="text-button" type="button">비밀번호 재설정으로 이동</button></div>
      </section>

      <section id="pwPanel" role="tabpanel" aria-labelledby="pwTab" hidden>
        <form id="verifyForm">
          <fieldset id="identityFields">
            <div class="field"><label for="findPwId">아이디</label><input id="findPwId" name="user_id" autocomplete="username" maxlength="30" required placeholder="가입된 아이디"></div>
            <div class="field"><label for="findPwName">이름</label><input id="findPwName" name="user_name" autocomplete="name" maxlength="10" required placeholder="가입 시 입력한 이름"></div>
            <div class="field"><label for="findPwBirth">생년월일</label><input id="findPwBirth" name="user_birth" inputmode="numeric" autocomplete="bday" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" required placeholder="YYYY-MM-DD"></div>
          </fieldset>
          <button id="verifyButton" class="primary" type="submit">가입 정보 확인</button>
        </form>
        <p id="verifyStatus" class="status" role="status" aria-live="polite" hidden></p>

        <section id="resetSection" class="reset-section" aria-labelledby="resetTitle" hidden>
          <div class="section-heading"><h2 id="resetTitle">새 비밀번호 설정</h2><button id="editIdentity" class="text-button" type="button">가입 정보 다시 입력</button></div>
          <form id="resetForm">
            <div class="field"><label for="newPassword">새 비밀번호</label><input id="newPassword" type="password" autocomplete="new-password" minlength="4" maxlength="72" required aria-describedby="passwordHelp"><small id="passwordHelp">4자 이상, UTF-8 기준 72바이트 이내로 입력해 주세요.</small></div>
            <div class="field"><label for="confirmPassword">새 비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="72" required aria-describedby="passwordMatch"><small id="passwordMatch" aria-live="polite"></small></div>
            <label class="show-password"><input id="showPassword" type="checkbox"> 비밀번호 표시</label>
            <button id="resetButton" class="primary" type="submit">비밀번호 변경</button>
          </form>
          <p id="resetStatus" class="status" role="status" aria-live="polite" hidden></p>
        </section>
      </section>
      <a class="home-link" href="/">홈으로 돌아가기 <span aria-hidden="true">→</span></a>
    </section>
    <p class="footer-note">메디스캔 노트 · 의료영상 판독 학습</p>
  </main>
</body>
</html>
